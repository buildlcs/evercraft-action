name: Build Evercraft Action 26.3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['evercraft-action-source.zip', '.github/workflows/build-fabric-26.3.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Extract source files
        run: unzip -q evercraft-action-source.zip -d .
      - name: Build mod
        working-directory: fabric/26.3
        run: bash ./gradlew --no-daemon --console=plain build
      - name: Upload the mod
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: evercraft-action-fabric-26.3
          path: |
            fabric/26.3/build/libs/*.jar
            !fabric/26.3/build/libs/*-sources.jar
